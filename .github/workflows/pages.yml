name: Build data and deploy to GitHub Pages

on:
  # The data is committed in web/public/data, so a normal run only builds and deploys the site.
  # Crawl the source again only by hand (Actions -> Run workflow -> crawl), e.g. if it publishes new records.
  workflow_dispatch:
    inputs:
      crawl:
        description: Crawl the source and rebuild the data before deploying
        type: boolean
        default: false
      refresh:
        description: When crawling, download every page again instead of reusing cached ones
        type: boolean
        default: false
  push:
    branches: [master, main]
    paths:
      - "scraper/**"
      - "web/**"
      - "highlights/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      # Downloaded pages are kept between crawls, so a crawl only fetches what is missing.
      - name: Restore page cache
        if: inputs.crawl == true
        uses: actions/cache@v6
        with:
          path: scraper/.cache/html
          key: pages-html-${{ github.run_id }}
          restore-keys: pages-html-

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install scraper
        run: pip install -e ./scraper

      - name: Test scraper
        run: |
          pip install pytest
          cd scraper && python -m pytest -q

      - name: Crawl (polite, one request at a time)
        if: inputs.crawl == true
        env:
          REFRESH: ${{ inputs.refresh == true }}
        run: |
          if [ "$REFRESH" = "true" ]; then
            curacao-scraper crawl --refresh
          else
            curacao-scraper crawl
          fi

      # Without a crawl the committed data is deployed as it is.
      - name: Build graph.json
        id: data
        if: inputs.crawl == true
        run: |
          curacao-scraper build --highlights highlights
          echo "rebuilt=true" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json # pnpm version comes from its packageManager field

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build site
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          if [ "${{ steps.data.outputs.rebuilt }}" = "true" ]; then pnpm run layout; fi
          pnpm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
