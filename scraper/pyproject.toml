[project]
name = "curacao-scraper"
version = "0.1.0"
description = "Scrapes the public Casino Secrets (curacaofiles.com) register pages into a single graph JSON file."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "parsel>=1.10",
]

[project.scripts]
curacao-scraper = "curacao_scraper.cli:main"

[dependency-groups]
dev = ["pytest>=8", "faker>=40", "anyascii>=0.3"]  # faker/anyascii only for tools/build_name_lists.py

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curacao_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
